name: Lazi Verify Worker

on:
  repository_dispatch:
    types: [verify_request]
  workflow_dispatch:
    inputs:
      link:
        description: 'Link Lazi'
        required: true
        default: 'https://lazi.vn/user/tien-nam.nguyen20'
      code:
        description: 'Ma xac thuc'
        required: true
        default: 'TEST'
      request_id:
        description: 'Request ID'
        required: true
        default: 'req_test'

jobs:
  run-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Python Script (API Dispatch)
        if: github.event_name == 'repository_dispatch'
        run: |
          python checker.py "${{ github.event.client_payload.link }}" "${{ github.event.client_payload.code }}" "${{ github.event.client_payload.request_id }}"

      - name: Run Python Script (Manual Run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          python checker.py "${{ github.event.inputs.link }}" "${{ github.event.inputs.code }}" "${{ github.event.inputs.request_id }}"
